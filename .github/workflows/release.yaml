name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      build_from:
        description: |
          Branch or tag to build release artifacts from.
        required: false
      release_as:
        description: |
          Publish release under this tag, or update release assets if such release exists.
          If empty, release publishing will be skipped.
        required: false
        default: ""
      linux_os:
        description: |
          JSON array of Linux distros to build, for example ["el10"].
          Build a subset to add assets for a new distro to a release that
          already exists, without rebuilding the assets it already has.
          Empty builds every distro.
        required: false
        default: ""
      skip_mac:
        description: |
          Skip the macOS builds. Set this when the release already has its
          macOS assets.
        required: false
        type: boolean
        default: false
      skip_linux_old:
        description: |
          Skip the amzn2, el7 and alpine3.15.1 builds. Set this when the
          release already has those assets.
        required: false
        type: boolean
        default: false

jobs:
  mac:
    if: ${{ !inputs.skip_mac }}
    name: macOS (${{ matrix.os }} ${{ matrix.otp }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            otp: "26.2.5.14-1"
            rebar3: "3.22.0"
          - os: macos-26
            otp: "26.2.5.14-1"
            rebar3: "3.22.0"
          - os: macos-15
            otp: "27.3.4.2-6"
            rebar3: "3.22.0"
          - os: macos-26
            otp: "27.3.4.2-6"
            rebar3: "3.22.0"
          - os: macos-15
            otp: "28.4.1-1"
            rebar3: "3.25.1"
          - os: macos-26
            otp: "28.4.1-1"
            rebar3: "3.25.1"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: emqx/macos-erlang@f744c98139c0db83a10619587d4bae4fc49765a8 # v1.0.0
        with:
          otp-version: ${{ matrix.otp }}
          rebar3-version: ${{ matrix.rebar3 }}

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.build_from }} # when input is not given, the event tag is used

      - name: build release
        env:
          BUILD_RELEASE: 1
          CI_RELEASE_VERSION: ${{ github.event.inputs.release_as }}
        run: ./build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.otp }}
          path: |
            _packages/*.tar.gz
            _packages/*.tar.gz.sha256

  linux:
    name: linux (${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.builder.otp }})
    strategy:
      fail-fast: false
      matrix:
        # The prebuilt file name carries the OTP major only, so one asset per
        # (version, OTP major, distro, arch) serves every OTP patch release.
        os: >-
          ${{ fromJSON(github.event.inputs.linux_os || '["ubuntu24.04",
          "ubuntu22.04", "ubuntu20.04", "debian13", "debian12", "debian11",
          "amzn2023", "el8", "el9", "el10"]') }}
        arch:
          - amd64
          - arm64
        builder:
          - vsn: "6.2-3:1.15.7-26.2.5.14-1"
            otp: "26.2.5.14-1"
          - vsn: "6.2-3:1.18.3-27.3.4.2-9"
            otp: "27.3.4.2-9"
          - vsn: "6.2-3:1.19.1-28.5.0.7-3"
            otp: "28.5.0.7-3"

    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}
    container: ghcr.io/emqx/emqx-builder/${{ matrix.builder.vsn }}-${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.build_from }} # when input is not given, the event tag is used

      - run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: build release
        env:
          BUILD_RELEASE: 1
          CI_RELEASE_VERSION: ${{ github.event.inputs.release_as }}
        run: ./build.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.builder.otp }}
          path: |
            _packages/*.tar.gz
            _packages/*.tar.gz.sha256

  linux-old:
    # el7 does not work when using 'container' due to old nodejs version
    # same with amzn2, plus it needs even more handholding
    # JavaScript Actions in Alpine containers are only supported on x64 Linux runners
    name: linux (${{ matrix.os }} ${{ matrix.arch }} ${{ matrix.builder.otp }})
    if: ${{ !inputs.skip_linux_old }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - amzn2
          - el7
          - alpine3.15.1
        arch:
          - amd64
          - arm64
        builder:
          - vsn: "6.2-3:1.15.7-26.2.5.14-1"
            otp: "26.2.5.14-1"
          - vsn: "6.2-3:1.18.3-27.3.4.2-9"
            otp: "27.3.4.2-9"
          - vsn: "6.2-3:1.19.1-28.5.0.7-3"
            otp: "28.5.0.7-3"

    runs-on: ubuntu-24.04${{ matrix.arch == 'arm64' && '-arm' || '' }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive
          fetch-depth: 0
          ref: ${{ github.event.inputs.build_from }} # when input is not given, the event tag is used

      - name: build release
        if: matrix.os == 'amzn2'
        env:
          CI_RELEASE_VERSION: ${{ github.event.inputs.release_as }}
          CONTAINER: ghcr.io/emqx/emqx-builder/${{ matrix.builder.vsn }}-${{ matrix.os }}
        run: |
          docker build --build-arg FROM=$CONTAINER -t emqx-builder:amzn2 -f .ci/Dockerfile.amzn2 .
          docker run -t --rm --user 1001 \
            -v $(pwd):/wd \
            --workdir /wd \
            -e BUILD_RELEASE=1 \
            -e CI_RELEASE_VERSION=$CI_RELEASE_VERSION \
            emqx-builder:amzn2 bash -euc './build.sh'

      - name: build release
        if: matrix.os != 'amzn2'
        env:
          CI_RELEASE_VERSION: ${{ github.event.inputs.release_as }}
          CONTAINER: ghcr.io/emqx/emqx-builder/${{ matrix.builder.vsn }}-${{ matrix.os }}
        run: |
          docker run -t --rm --user 1001 \
            -v $(pwd):/wd \
            --workdir /wd \
            -e BUILD_RELEASE=1 \
            -e CI_RELEASE_VERSION=$CI_RELEASE_VERSION \
            $CONTAINER bash -euc './build.sh'

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.builder.otp }}
          path: |
            _packages/*.tar.gz
            _packages/*.tar.gz.sha256

  release:
    runs-on: ubuntu-latest
    needs:
      - mac
      - linux
      - linux-old
    # always(), because the mac and linux-old jobs are skipped when their
    # skip input is set, and a skipped dependency skips this job unless the
    # condition states otherwise.
    if: >-
      always()
      && needs.linux.result == 'success'
      && needs.mac.result != 'failure' && needs.mac.result != 'cancelled'
      && needs['linux-old'].result != 'failure' && needs['linux-old'].result != 'cancelled'
      && (startsWith(github.ref, 'refs/tags/') || inputs.release_as)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: 'packages-*'
          path: packages
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          name: Erlang jq NIF ${{ github.event.inputs.release_as || github.ref_name }} Released
          tag_name: ${{ github.event.inputs.release_as || github.ref_name }}
          files: "packages/*"
